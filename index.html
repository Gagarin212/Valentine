<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will you be my Valentine?</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Страница 1: Valentine Screen -->
    <div id="page1" class="page active">
        <div class="hearts-background">
            <div class="heart heart1">❤️</div>
            <div class="heart heart2">❤️</div>
            <div class="heart heart3">❤️</div>
            <div class="heart heart4">❤️</div>
            <div class="heart heart5">❤️</div>
            <div class="heart heart6">💕</div>
            <div class="heart heart7">💖</div>
            <div class="heart heart8">💗</div>
        </div>
        <div class="container">
            <h1 class="main-text">Will you be my Valentine?</h1>
            
            <div class="buttons-container">
                <button id="yesBtn" class="btn btn-yes">Yes</button>
                <button id="noBtn" class="btn btn-no">No</button>
            </div>
            
            <div class="character">
                <div class="cat">
                    <div class="cat-head">
                        <div class="cat-ear cat-ear-left"></div>
                        <div class="cat-ear cat-ear-right"></div>
                        <div class="cat-face">
                            <div class="cat-eye cat-eye-left"></div>
                            <div class="cat-eye cat-eye-right"></div>
                            <div class="cat-nose"></div>
                            <div class="cat-mouth"></div>
                        </div>
                    </div>
                    <div class="cat-body"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Страница 2: Открытка -->
    <div id="page2" class="page">
        <div class="hearts-background">
            <div class="heart heart1">❤️</div>
            <div class="heart heart2">❤️</div>
            <div class="heart heart3">❤️</div>
            <div class="heart heart4">❤️</div>
            <div class="heart heart5">❤️</div>
            <div class="heart heart6">💕</div>
            <div class="heart heart7">💖</div>
            <div class="heart heart8">💗</div>
        </div>
        
        <div class="card-container">
            <div class="envelope-wrapper">
                <div class="envelope" id="envelope">
                    <div class="envelope-body"></div>
                    <div class="envelope-flap-bottom"></div>
                    <div class="envelope-flap-left"></div>
                    <div class="envelope-flap-right"></div>
                    <div class="letter" id="letter">
                        <div class="letter-content">
                            <h2>Happy Valentine's Day!</h2>
                            <p>You make my heart skip a beat every day. 💕</p>
                            <p>Thank you for being in my life!</p>
                            <p class="signature">With love ❤️</p>
                        </div>
                    </div>
                    <div class="envelope-flap-top" id="envelopeFlap"></div>
                </div>
            </div>
            
            <div class="card-buttons">
                <button id="openBtn" class="btn btn-open">OPEN</button>
                <button id="closeBtn" class="btn btn-close">CLOSE</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
